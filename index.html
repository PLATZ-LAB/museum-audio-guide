<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>미술관 오디오 가이드</title><style>body{margin:0;background:#f5f3ef;color:#272724;font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif}.wrap{max-width:520px;margin:0 auto;padding:40px 22px}header{font-size:13px;letter-spacing:3px;color:#777;border-bottom:1px solid #d9d5ce;padding-bottom:22px}.no{margin-top:60px;font-size:14px;color:#777;letter-spacing:2px}h1{font-size:32px;line-height:1.3;margin:12px 0 10px}.artist{color:#666;font-size:15px}.player{background:white;border:1px solid #e7e2da;border-radius:16px;padding:24px;margin:35px 0;box-shadow:0 6px 22px #00000008}audio{width:100%;margin-top:12px}.hint{font-size:13px;color:#777;line-height:1.7}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:35px}.nav a{color:#333;text-decoration:none;border:1px solid #ccc;padding:11px 15px;border-radius:8px}.hidden{visibility:hidden}footer{font-size:12px;color:#999;margin-top:70px;text-align:center}</style></head><body><main class="wrap"><header>MUSEUM · AUDIO GUIDE</header><div class="no" id="number"></div><h1 id="title"></h1><div class="artist" id="artist"></div><section class="player"><div>작품 음성 해설</div><audio id="audio" controls preload="metadata" controlsList="nodownload">브라우저에서 오디오를 지원하지 않습니다.</audio><p class="hint">재생 버튼을 눌러 작품 해설을 들어보세요.</p></section><div class="nav"><a id="prev">← 이전 작품</a><a id="next">다음 작품 →</a></div><footer>미술관 음성 안내 서비스</footer></main><script>const q=new URLSearchParams(location.search);let n=Number(q.get('work')||'1');if(!Number.isInteger(n)||n<1||n>52)n=1;let id=String(n).padStart(2,'0');document.getElementById('number').textContent='ARTWORK '+id+' / 52';fetch('works.csv?v=20261013').then(r=>{if(!r.ok)throw Error('CSV');return r.text()}).then(t=>{const lines=t.replace(/^\uFEFF/,'').trim().split(/\r?\n/);const row=lines[n];if(!row)return;const cols=row.split(',');const title=cols[1]||'작품 '+id;const artist=cols[2]||'';const year=cols[3]||'';document.getElementById('title').textContent=title;document.getElementById('artist').textContent=artist+(year?' · '+year:'');document.title=title+' | 미술관 오디오 가이드';}).catch(()=>{});document.getElementById('title').textContent='작품 '+id;document.getElementById('artist').textContent='오디오 가이드';document.getElementById('audio').src=id+'.mp3';document.title='작품 '+id+' | 미술관 오디오 가이드';for(const [key,target] of [['prev',n-1],['next',n+1]]){let a=document.getElementById(key);if(target<1||target>52)a.classList.add('hidden');else a.href='?work='+String(target).padStart(2,'0');}</script></body></html>
